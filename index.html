<!doctype html>
<html lang="zh-CN">

<title>给宝宝的惩罚 ♡</title>
<style>
  :root { --ink:#365b60; --brown:#557c77; --aqua:#90c0df; --cream:#c8e4f3; --paper:#e3f3e6; --pink:#f1b5c1; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh;
    background:
      radial-gradient(circle,#99c3ac 1.1px,transparent 1.4px) 0 0/18px 18px,
      radial-gradient(ellipse 88% 55% at 52% 31%,#f0fbf4 0%,transparent 76%),
      linear-gradient(165deg,#d0ead9 0%,#dff1df 50%,#ecf7e5 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,textarea { font:inherit; }
  .app { width:min(100%,500px); margin:0 auto; padding:clamp(22px,5vh,38px) 16px max(30px,env(safe-area-inset-bottom)); text-align:center; }
  .top-label { display:inline-flex; gap:7px; align-items:center; border:1.6px solid #a8cbb9; border-radius:999px; background:#f9fffbdf; padding:7px 14px; color:#567969; font-size:11px; letter-spacing:.14em; font-weight:800; }
  .sparkle { color:#d38ca8; }
  h1 { margin:17px 0 9px; font-size:clamp(25px,7vw,37px); letter-spacing:.06em; font-weight:900; line-height:1.3; text-shadow:2px 2px 0 #f8fff9; overflow-wrap:anywhere; }
 
  .scene { width:min(100%,455px); aspect-ratio:1; position:relative; margin:3px auto 0; display:grid; place-items:center; }
  .scene::before { content:""; width:100%; height:100%; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle,#f7ffff00 59%,#f9f3e775 74%,transparent 75%); pointer-events:none; }
  .wheel-frame { width:93%; height:93%; border-radius:50%; filter:drop-shadow(0 8px 0 rgba(67,108,106,.17)); overflow:visible; }
  .wheel-frame{ position:relative; }
  .wheel-fallback { width:100%; height:100%; display:block; border-radius:50%; }
  canvas { width:100%; height:100%; display:block; position:absolute; inset:0; border-radius:50%; transform:rotate(0deg); will-change:transform; }
  .pointer { position:absolute; width:13%; max-width:58px; top:1%; left:50%; transform:translateX(-50%); z-index:6; pointer-events:none; filter:drop-shadow(0 2px 0 #ffffffb8); }
  .face { z-index:3; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:34%; aspect-ratio:1; border:0; border-radius:50%; background:transparent; padding:0; cursor:pointer; transition:transform .17s ease; }
  .face:active { transform:translate(-50%,-50%) scale(.95); }
  .face:focus-visible { outline:3px solid #db8c95; outline-offset:4px; }
  .face svg { display:block; width:100%; height:100%; filter:drop-shadow(0 3px 1px #78565150); }
   .mini-star { position:absolute; color:#92aeb7; font-size:18px; }
  .mini-star.one { left:1%; top:15%; transform:rotate(-18deg); }
  .mini-star.two { right:0; bottom:17%; transform:rotate(14deg); }
  .status { min-height:65px; display:flex; align-items:center; justify-content:center; flex-direction:column; margin-top:-7px; gap:3px; }
  .status-tag { font-size:10px; font-weight:900; letter-spacing:.17em; color:#7199a2; }
  .status-result { font-size:clamp(16px,5vw,22px); font-weight:900; color:#3b6371; line-height:1.35; overflow-wrap:anywhere; }
  .status-result.winner { animation: pop .55s cubic-bezier(.18,1.4,.47,1); }
  @keyframes pop { from{transform:scale(.74);opacity:.4} to{transform:scale(1);opacity:1} }
  .spin { display:block; width:min(90%,330px); margin:10px auto 0; min-height:57px; border:2px solid #5a8999; border-radius:18px; background:linear-gradient(#bbdfef,#91c3dc); color:#2c5366; box-shadow:0 6px 0 #74a5ba, 0 9px 14px #6d9aa633; font-size:19px; font-weight:900; letter-spacing:.09em; cursor:pointer; touch-action:manipulation; transition:transform .15s,box-shadow .15s; }
  .spin:active:not(:disabled) { transform:translateY(4px); box-shadow:0 2px 0 #74a5ba; }
  .spin:disabled { opacity:.7; cursor:wait; }
  .hint { font-size:11px; margin:13px 0 20px; color:#6d8e80; }
  .preview-notice { padding:11px 13px; margin:8px 6px 18px; background:#fff8e9; border:1.5px solid #e6cba7; border-radius:12px; color:#956951; font-size:12px; font-weight:700; line-height:1.6; }
  .editor { margin:0 auto; text-align:left; width:min(100%,430px); background:#f9fffaf2; border:2px solid #accfbe; border-radius:21px; box-shadow:0 5px 0 #accfbd4a; overflow:hidden; }
  .editor summary { padding:18px 19px; cursor:pointer; list-style:none; user-select:none; font-size:14px; font-weight:900; display:flex; align-items:center; justify-content:space-between; }
  .editor summary::-webkit-details-marker { display:none; }
  .editor summary::after { content:'＋'; color:#8f7772; font-size:21px; font-weight:400; line-height:1; }
  .editor[open] summary::after { content:'−'; }
  .edit-body { border-top:1px dashed #b4cfbd; padding:16px 19px 19px; }
  label { display:block; font-size:12px; margin:0 0 7px; font-weight:900; }
  input,textarea { width:100%; padding:11px 12px; border:1.7px solid #adcac3; border-radius:11px; background:#fff; color:var(--ink); outline:none; font-size:14px; }
  input:focus,textarea:focus { border-color:#d896a0; box-shadow:0 0 0 3px #f9e7ea; }
  textarea { min-height:188px; resize:vertical; line-height:1.65; }
  .field { margin-bottom:13px; }
  .edit-note { color:#907e78; font-size:11px; line-height:1.65; margin:7px 0 13px; }
  .edit-actions { display:flex; gap:8px; }
  .save, .reset { min-height:43px; border-radius:11px; font-size:13px; font-weight:900; cursor:pointer; }
  .save { flex:1; color:#ffffff; background:#6eaaa9; border:1.5px solid #598e8d; }
  .reset { padding:0 13px; background:#fffaf0; border:1.5px solid #cfb4a3; color:#856c63; }
  .edit-error { color:#bc5665; font-size:12px; line-height:1.4; min-height:16px; margin-top:9px; }
  .footer { margin-top:21px; font-size:10px; color:#7ba090; letter-spacing:.04em; }
  @media(prefers-reduced-motion:reduce){.status-result.winner{animation:none}}
  @media(max-width:360px){.app{padding-left:8px;padding-right:8px}.scene{width:100%}.status{margin-top:-3px}}
</style>

<script>
(() => {
  'use strict';
  const DEFAULT_TITLE = '给宝宝的惩罚';
  const DEFAULT_OPTIONS = [
    '一星期不可以视频',
    '说你爱我',
    '买小蛋糕送到我家',
    '转款52rmb',
    '写道歉信',
    '说出我的十个优点',
    '答应我一件事',
    '买吃的送到我家',
    '再转一次',
    '一个月内不管我说什么你都要答应',
    '下次见面的时候按摩20分钟',
    '亲我三次',
    '12点前上床睡觉（不接受任何理由）',
    '买一只口红',
    '买一个护肤品',
    '买12瓶1.5L的水送到我家',
    '下次旅游的时候全程帮我拿包包',
    '下次见面第一天不可以干坏事'
  ];
  // Short labels only for the wheel. The full original wording is shown in the result.
  const WHEEL_LABELS = new Map([
    ['一星期不可以视频','一周不视频'],
    ['说你爱我','说爱我'],
    ['买小蛋糕送到我家','送小蛋糕'],
    ['转款52rmb','转52元'],
    ['写道歉信','写道歉信'],
    ['说出我的十个优点','十个优点'],
    ['答应我一件事','答应一件事'],
    ['买吃的送到我家','送吃的'],
    ['再转一次','再转一次'],
    ['一个月内不管我说什么你都要答应','一个月全答应'],
    ['下次见面的时候按摩20分钟','按摩20分钟'],
    ['亲我三次','亲三次'],
    ['12点前上床睡觉（不接受任何理由）','12点前睡觉'],
    ['买一只口红','买口红'],
    ['买一个护肤品','买护肤品'],
    ['买12瓶1.5L的水送到我家','送12瓶水'],
    ['下次旅游的时候全程帮我拿包包','旅游帮拿包'],
    ['下次见面第一天不可以干坏事','见面第一天乖乖']
  ]);
  const $ = (id) => document.getElementById(id);
  const wheel = $('wheel'); const ctx = wheel.getContext('2d');
  let items = [...DEFAULT_OPTIONS], title = DEFAULT_TITLE;
  let rotation = 0, spinning = false, selected = -1;
  let currentSpinCleanup = null, spinRunId = 0;
  const step = () => 360 / items.length;
  const mod = (x, n) => (x % n + n) % n;
  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem('kawaii-roulette-baobao-v1') || 'null');
      if (saved && typeof saved.title === 'string' && Array.isArray(saved.items) && saved.items.length >= 2 && saved.items.length <= 24 && saved.items.every(x=>typeof x === 'string')) {
        title = saved.title || DEFAULT_TITLE; items = saved.items;
      }
    } catch (_) { /* storage may be disabled in file previews */ }
  }
  function persist() {
    try { localStorage.setItem('kawaii-roulette-baobao-v1', JSON.stringify({title,items})); } catch (_) {}
  }
  function wrap(text, maxChars=3, maxLines=3) {
    const clean = text.trim().replace(/\s+/g,' ');
    const chars = Array.from(clean); const lines=[];
    while(chars.length && lines.length < maxLines) lines.push(chars.splice(0,maxChars).join(''));
    if(chars.length) lines[lines.length - 1] = Array.from(lines[lines.length-1]).slice(0,Math.max(1,maxChars-1)).join('') + '…';
    return lines;
  }
  function drawWheel() {
    if (!ctx) return;
    const W=760, C=380, R=375, innerR=349;
    ctx.clearRect(0,0,W,W);
    ctx.save(); ctx.translate(C,C);
    ctx.beginPath(); ctx.arc(0,0,R-2,0,2*Math.PI); ctx.fillStyle='#93bfd7'; ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle='#587d90'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,innerR+7,0,Math.PI*2); ctx.fillStyle='#edf7fa'; ctx.fill(); ctx.lineWidth=2.6;ctx.strokeStyle='#648c9e';ctx.stroke();
    const slice = 2*Math.PI/items.length;
    for(let i=0;i<items.length;i++) {
      let a=-Math.PI/2+(i-.5)*slice, b=a+slice;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,innerR,a,b); ctx.closePath();
      ctx.fillStyle= i%2===0?'#c8e4f3':'#90c0df'; ctx.fill(); ctx.lineWidth=2.5;ctx.strokeStyle='#65899d';ctx.stroke();
      ctx.save();
      ctx.rotate(-Math.PI/2+i*slice+Math.PI/2);
      let chars = items.length >= 21?2:items.length>=15?3:items.length>=10?4:5;
      let lines = wrap(WHEEL_LABELS.get(items[i]) || items[i], chars, 3);
      let size = items.length>=22?22:items.length>=17?25:items.length>=12?28:32;
      ctx.fillStyle='#34596a'; ctx.font=`bold ${size}px -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      const maxWidth=items.length>=20?62:items.length>=16?78:items.length>=12?95:125;
      const start= innerR*(lines.length===1?.74:lines.length===2?.78:.84);
      lines.forEach((line, lineIndex) => {
        ctx.fillText(line,0,-start+lineIndex*(size+6),maxWidth);
      });
      ctx.restore();
    }
    // A little stitched pattern around the outer ring.
    for(let i=0;i<72;i++) {
      let a=i*2*Math.PI/72; let r=364;
      ctx.save(); ctx.translate(Math.cos(a)*r,Math.sin(a)*r);
      ctx.rotate(a);
      ctx.fillStyle= i%3===0?'#f7ffff':'#6c9aae';
      ctx.beginPath(); ctx.arc(0,0,i%3===0?2.3:1.35,0,2*Math.PI);ctx.fill();ctx.restore();
    }
    ctx.beginPath();ctx.arc(0,0,innerR,0,Math.PI*2);ctx.lineWidth=3.1;ctx.strokeStyle='#65899d';ctx.stroke();
    ctx.restore();
    wheel.setAttribute('aria-label',`包含${items.length}个选项的转盘`);
  }
  function setResult(tag, message, isWinner=false) {
    $('statusTag').textContent=tag;
    const el=$('result');el.classList.remove('winner');void el.offsetWidth;el.textContent=message;
    if(isWinner) el.classList.add('winner');
  }
  function setEnabled(enabled) {
    $('spin').disabled = !enabled; $('save').disabled = !enabled; $('reset').disabled=!enabled; $('faceSpin').disabled=!enabled;
  }
  function finishSpin(index) {
    if(!spinning)return;
    spinning=false;selected=index;setEnabled(true);
    if(currentSpinCleanup) { currentSpinCleanup(); currentSpinCleanup = null; }
    wheel.style.transition='none'; rotation=mod(rotation,360);
    wheel.style.transform=`rotate(${rotation}deg)`;
    setResult('✦ 抽中啦 ✦',items[index],true);
    $('spin').textContent='再转一次 ↻';
    try { if(navigator.vibrate)navigator.vibrate([35,30,45]); } catch (_) {}
  }
  function spin() {
    if(spinning || items.length<2)return;
    spinning=true;setEnabled(false);
    const run = ++spinRunId;
    $('spin').textContent='转动中…';setResult('转动中…','');
    let chosen=Math.floor(Math.random()*items.length);
    const jitter=(Math.random()-.5)*step()*.46;
    const desired=mod(-chosen*step()+jitter,360);
    const additional=mod(desired-mod(rotation,360),360);
    const turns=6+Math.floor(Math.random()*3);
    rotation += 360*turns+additional;
    const duration=4800+Math.floor(Math.random()*500);
    wheel.style.transition=`transform ${duration}ms cubic-bezier(.10,.75,.12,1)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { wheel.style.transform=`rotate(${rotation}deg)`; }));
    // Timeout handles browsers that do not dispatch transitionend in background tabs.
    const finish=()=>{ if(spinRunId===run) finishSpin(chosen); };
    const handler=(e)=>{ if(e.propertyName==='transform') finish(); };
    wheel.addEventListener('transitionend',handler);
    const timer=setTimeout(finish,duration+200);
    currentSpinCleanup=()=>{wheel.removeEventListener('transitionend',handler);clearTimeout(timer);};
  }
  function update() {
    if(spinning)return;
    const newTitle=$('titleInput').value.trim() || '我的转盘';
    const newItems=$('optionsInput').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    if(newItems.length<2||newItems.length>24){$('error').textContent='请设置2～24个选项。';return;}
    if(newItems.some(x=>Array.from(x).length>50)){$('error').textContent='每个选项请不要超过50个字。';return;}
    title=newTitle;items=newItems;rotation=0;selected=-1;
    $('pageTitle').textContent=title;
    wheel.style.transition='none';wheel.style.transform='rotate(0deg)';drawWheel();persist();
    $('error').textContent='保存成功 ♡';setResult('READY TO SPIN','已经更新好啦 ♡');
    $('spin').textContent='开始转转 ✦';$('editor').open=false;
  }
  function reset() {
    if(spinning)return;
    $('titleInput').value=DEFAULT_TITLE; $('optionsInput').value=DEFAULT_OPTIONS.join('\n'); update();
  }
  load();drawWheel();$('pageTitle').textContent=title;
  document.querySelector('.wheel-fallback').style.display='none';
  $('previewNotice').style.display='none';
  $('titleInput').value=title;$('optionsInput').value=items.join('\n');
  $('spin').addEventListener('click',spin);$('faceSpin').addEventListener('click',spin);
  $('save').addEventListener('click',update);$('reset').addEventListener('click',reset);
})();
